<div class="mx-auto max-w-3xl space-y-8 p-6">
  <header class="space-y-1">
    <h1 class="text-2xl font-medium tracking-tight">AutoFinance</h1>
    <p class="text-muted-foreground">
      Plataforma de simulación de crédito vehicular para concesionarias.
    </p>
  </header>

  <section class="space-y-3" aria-label="Demostración del tema (provisional)">
    <div class="flex flex-wrap items-center gap-3">
      <button hlmBtn>Generar simulación</button>
      <button hlmBtn variant="outline">Guardar</button>
      <button hlmBtn variant="secondary">Reabrir</button>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <span class="inline-flex items-center gap-1.5 rounded-full bg-success/10 px-3 py-1 text-sm font-medium text-success">
        <span aria-hidden="true">↑</span>
        <span class="font-mono tabular-nums">VAN +4,436.18</span>
      </span>
      <span class="inline-flex items-center gap-1.5 rounded-full bg-destructive/10 px-3 py-1 text-sm font-medium text-destructive">
        <span aria-hidden="true">↓</span>
        <span class="font-mono tabular-nums">VAN −9,420.70</span>
      </span>
      <span class="inline-flex items-center gap-1.5 rounded-full bg-warning px-3 py-1 text-sm font-medium text-warning-foreground">
        <span aria-hidden="true">●</span>
        <span>Liquidación del cuotón</span>
      </span>
    </div>
  </section>
</div>
