<div class="page">
  <header class="page-header">
    <h1 class="text-2xl font-medium tracking-tight">Hola, {{ username() }}</h1>
    <p class="text-muted-foreground">
      Gestiona ofertas y cotizaciones de crédito vehicular.
    </p>
  </header>

  <div class="cards">
    <a hlmCard class="card card--link" routerLink="/vehicle-offers">
      <div hlmCardHeader>
        <h2 hlmCardTitle>Ofertas vehiculares</h2>
        <p hlmCardDescription>Registra y administra los vehículos que financias.</p>
      </div>
    </a>

    <a hlmCard class="card card--link" routerLink="/clients">
      <div hlmCardHeader>
        <h2 hlmCardTitle>Clientes</h2>
        <p hlmCardDescription>Registra y administra los deudores de tus operaciones.</p>
      </div>
    </a>

    <div hlmCard class="card card--soon" aria-disabled="true">
      <div hlmCardHeader>
        <h2 hlmCardTitle>Cotización</h2>
        <p hlmCardDescription>Próximamente</p>
      </div>
    </div>
  </div>
</div>
