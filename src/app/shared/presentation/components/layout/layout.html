<header class="layout-header">
  <h1>AutoFinance</h1>
  <nav class="layout-nav" aria-label="Navegación principal">
    @for (option of options; track option.link) {
      <a [routerLink]="option.link" routerLinkActive="active">{{ option.label }}</a>
    }
  </nav>
  <div class="layout-actions">
    @if (currentUser(); as user) {
      <span class="layout-user">{{ user.username }}</span>
      <button hlmBtn variant="ghost" size="sm" type="button" (click)="signOut()">
        Cerrar sesión
      </button>
    }
    <app-theme-toggle/>
  </div>
</header>
<main>
  <router-outlet/>
</main>
<app-footer-content/>
