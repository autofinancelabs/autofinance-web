<div class="shell">
  <header class="topbar">
    <button
      type="button"
      class="topbar__menu"
      (click)="toggleDrawer()"
      aria-label="Abrir menú"
      [attr.aria-expanded]="drawerOpen()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <a routerLink="/dashboard" class="topbar__brand" aria-label="AutoFinance, ir al inicio">
      <app-brand />
    </a>
    <span class="topbar__spacer"></span>
    <app-theme-toggle />
  </header>

  <div class="body">
    @if (drawerOpen()) {
      <div class="backdrop" (click)="closeDrawer()" aria-hidden="true"></div>
    }

    <aside class="sidebar" [class.sidebar--open]="drawerOpen()">
      <nav class="sidebar__nav" aria-label="Navegación principal">
        <a
          class="sidebar__item"
          routerLink="/dashboard"
          routerLinkActive="sidebar__item--active"
          (click)="closeDrawer()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="7" height="9" rx="1" />
            <rect x="14" y="3" width="7" height="5" rx="1" />
            <rect x="14" y="12" width="7" height="9" rx="1" />
            <rect x="3" y="16" width="7" height="5" rx="1" />
          </svg>
          <span>Dashboard</span>
        </a>
        <a
          class="sidebar__item"
          routerLink="/vehicle-offers"
          routerLinkActive="sidebar__item--active"
          (click)="closeDrawer()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13v5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z" />
            <circle cx="7.5" cy="16" r="0.5" />
            <circle cx="16.5" cy="16" r="0.5" />
          </svg>
          <span>Vehículos</span>
        </a>
        <a
          class="sidebar__item"
          routerLink="/clients"
          routerLinkActive="sidebar__item--active"
          (click)="closeDrawer()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span>Clientes</span>
        </a>
      </nav>

      <div class="sidebar__footer">
        @if (currentUser(); as user) {
          <p class="sidebar__user" title="{{ user.username }}">{{ user.username }}</p>
        }
        <button hlmBtn variant="ghost" type="button" class="sidebar__signout" (click)="signOut()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </aside>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
